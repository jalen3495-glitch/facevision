name: Decode image assets

on:
  push:
    branches: [main]
    paths:
      - "img/*.b64"
      - ".github/workflows/decode-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - name: Decode PNGs and commit to main and gh-pages
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branchdir in main gh-pages; do
            mkdir -p "$branchdir/img"
            for f in main/img/*.b64; do
              name=$(basename "$f" .b64)
              base64 -d "$f" > "$branchdir/img/$name"
            done
            # Keep the text source on both branches so the assets can be rebuilt
            cp main/img/*.b64 "$branchdir/img/"
            cd "$branchdir"
            git add img/*.png img/*.b64
            if ! git diff --cached --quiet; then
              git commit -m "Add decoded favicon and social preview images"
              git push
            fi
            cd ..
          done
