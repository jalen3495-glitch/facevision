name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Build static site (frontend files only)
        run: |
          mkdir -p _site/articles _site/js _site/img
          cp index.html about.html privacy.html terms.html contact.html 404.html app.js analytics.js config.js style.css robots.txt sitemap.xml ads.txt .nojekyll favicon.svg site.webmanifest _site/
          cp articles/*.html _site/articles/
          cp js/*.js _site/js/
          cp img/*.png _site/img/ 2>/dev/null || true
          cp img/*.svg _site/img/ 2>/dev/null || true
          # Do not copy CNAME until facevision.js.org (or another custom domain) is approved.
          # Re-enable the next line after the custom domain is live:
          # if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
